<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevTask — Gestión de tareas de desarrollo. Fase 2: refactorización a POO con TypeScript.">
  <title>DevTask — TypeScript POO Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <div class="header-brand">
        <span class="header-icon">⚡</span>
        <div>
          <h1>DevTask</h1>
          <p class="header-subtitle">TypeScript POO Edition</p>
        </div>
      </div>
    </header>

    <!-- Formulario para añadir nuevas tareas -->
    <section class="form-section" aria-label="Añadir tarea">
      <form id="form-tareas" novalidate>
        <input
          type="text"
          id="input-titulo"
          placeholder="¿Qué tienes que programar hoy?…"
          autocomplete="off"
          required
        >
        <select id="select-prioridad" aria-label="Prioridad">
          <option value="Alta">🔴 Alta</option>
          <option value="Media" selected>🟡 Media</option>
          <option value="Baja">🟢 Baja</option>
        </select>
        <button type="submit" id="btn-submit">+ Añadir</button>
      </form>
    </section>

    <!-- Botones de filtro -->
    <section class="filter-section" aria-label="Filtrar tareas">
      <button class="btn-filtro active" id="filtro-todas"      data-filtro="Todas">Todas</button>
      <button class="btn-filtro"        id="filtro-pendientes" data-filtro="Pendientes">Pendientes</button>
      <button class="btn-filtro"        id="filtro-completadas"data-filtro="Completadas">Completadas</button>
    </section>

    <!-- Lista de tareas -->
    <main class="tasks-section" aria-live="polite">
      <div id="loading-state" class="loading">
        <span class="loading-spinner"></span>
        Cargando tareas…
      </div>
      <ul id="lista-tareas" aria-label="Lista de tareas"></ul>
    </main>

  </div>

  <!-- Scripts en orden: primero la clase, luego el punto de entrada -->
  <script src="dist/TaskManager.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
